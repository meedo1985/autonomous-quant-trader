[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "autonomous-quant-trader"
version = "0.1.0"
description = "Governed crypto spot research infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    # Test/research-only. `specs/BACKTESTER_SPEC_v1.md` acceptance item 8 and
    # `docs/RESEARCH_CONSTITUTION.md` sections 16/18 require a NumPy reference
    # implementation. It lives under `tests/reference/`, imports no `aqt`
    # module and is never imported by `aqt`, so NumPy stays out of the
    # runtime `dependencies` list.
    "numpy>=2.1,<3",
    "pytest>=8.3,<9",
    "ruff==0.11.13",
    "mypy>=1.15,<2",
    "import-linter>=2.3,<3",
    "pre-commit>=4.2,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aqt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.importlinter]
root_package = "aqt"

[[tool.importlinter.contracts]]
name = "Research cannot reach protected runtime or lockbox packages"
type = "forbidden"
source_modules = ["aqt.research"]
forbidden_modules = ["aqt.governor", "aqt.execution", "aqt.lockbox_eval"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Governor cannot reach execution or model training"
type = "forbidden"
source_modules = ["aqt.governor"]
forbidden_modules = ["aqt.execution", "aqt.models"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Execution cannot reach model training"
type = "forbidden"
source_modules = ["aqt.execution"]
forbidden_modules = ["aqt.models"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Live packages cannot reach research agent code"
type = "forbidden"
source_modules = ["aqt.allocation", "aqt.governor", "aqt.execution", "aqt.monitoring"]
forbidden_modules = ["aqt.research"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Inactive paired evaluation cannot reach governed or external workflows"
type = "forbidden"
source_modules = ["aqt.metrics.assembly"]
forbidden_modules = [
    "aqt.core.code_identity",
    "aqt.data.manifest",
    "aqt.core.ledger",
    "aqt.core.preregistration",
    "aqt.research",
    "aqt.validation",
    "aqt.allocation",
    "aqt.governor",
    "aqt.execution",
    "aqt.lockbox_eval",
    "aqt.models",
    "aqt.monitoring",
]
allow_indirect_imports = false
