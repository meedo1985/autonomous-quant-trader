name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and dev tools
        run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      # The D-19 engine is tested on its own runtime, in calibration-tests.
      - run: python -m pytest --ignore-glob="tests/unit/test_calibration_*"
      - run: lint-imports

  # The D-19 engine's runtime is the calibration image's: Python 3.14 and
  # numpy 2.5.3 (deploy/calibration). On hosted Python 3.12 its start checks
  # refuse (numpy power differs from Python **) and OpenBLAS dgemm with the
  # pinned OPENBLAS_CORETYPE segfaults (PR #45, disclosed in
  # review/d19-engine/ADJUDICATION_FE4_1C44DB8.md).
  calibration-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner CPU (the engine pins OPENBLAS_CORETYPE=Haswell)
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | grep -owE 'avx2|fma|avx512f|avx512_bf16|amx_tile' | xargs
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and dev tools with the image's numpy
        run: python -m pip install -e ".[dev]" "numpy==2.5.3"
      # FE4R-2: no skip. On a CPU that crashes the pinned kernel (AMD EPYC
      # Zen 4/5) this job fails as inconclusive; rerun it to get a runner
      # that can run the engine. A green run always tested the engine.
      # On Intel AVX-512 runners (Xeon 8573C, 8370C) numpy's power differs
      # from Python ** and the engine refuses; that too is inconclusive, and
      # is caught here in seconds (CI_FINDING_XEON_8573C_AMX.md).
      - name: Probe the pinned OpenBLAS kernel on this CPU
        run: |
          rc=0
          OPENBLAS_NUM_THREADS=1 OPENBLAS_CORETYPE=Haswell python -B -c "import sys; sys.path[:0] = ['.', 'src']
          from calibration import fast, rundef; rundef.gating('probe')
          try:
              fast.self_check()
          except RuntimeError as error:  # CIA-1: only the known refusal, on AVX-512
              known = str(error) == 'NumPy power no longer matches Python ** on this runtime'
              if not (known and 'avx512f' in open('/proc/cpuinfo').read().split()):
                  raise
              print('::error::inconclusive: numpy power differs from Python ** on this AVX-512 CPU (seen on Intel Xeon runners), so the engine refuses; check the CPU line above and rerun the job')
              sys.exit(4)" || rc=$?
          if [ "$rc" = 139 ]; then echo "::error::inconclusive: the probe segfaulted (seen only on AMD EPYC Zen 4/5 runners, under the pinned OpenBLAS kernel); check the CPU line above and rerun the job"; fi
          exit "$rc"
      - name: Engine tests
        run: python -m pytest tests/unit/test_calibration_*.py tests/unit/test_d19_deploy.py
        env:
          PYTHONFAULTHANDLER: "1"  # a crashed subprocess shows where

  # Task 30 (owner answer Q30-4): deploy/RUNBOOK.md steps 2, 3 and a refused
  # step 5 on a fresh Ubuntu machine: the real service, started on a
  # modified checkout, must refuse (exit 2, logged).
  runbook-dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the bundle needs the whole history
      - name: Package this commit as the reviewed main (dry run only)
        run: |
          # On a push to main, main is checked out and cannot be force-moved;
          # a pull request's checkout is already detached.
          git checkout -q --detach
          git branch -f main HEAD
          git bundle create /tmp/app.bundle main
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Step 2, install
        run: cd /tmp && sudo sh "$GITHUB_WORKSPACE/deploy/install.sh" /tmp/app.bundle "$COMMIT"
      - name: The app's account cannot change its code, history or Python
        run: |
          test "$(stat -c %U /opt/aqt/app /opt/aqt/app/.git /opt/aqt/app/.venv/bin/python3 | sort -u)" = root
          for target in /opt/aqt/app/scripts /opt/aqt/app/.git/refs /opt/aqt/app/.venv/bin /etc/aqt; do
            if sudo -u aqt touch "$target/probe"; then echo "aqt can write $target"; exit 1; fi
          done
      - name: Step 3, approve and check
        run: |
          cd /tmp
          sudo /opt/aqt/app/.venv/bin/python -B /opt/aqt/app/scripts/deployment.py approve "$COMMIT" --by "CI dry run" --statement "runbook dry run"
          sudo -u aqt /opt/aqt/app/.venv/bin/python /opt/aqt/app/scripts/deployment.py check
          for target in /etc/aqt/deployments.jsonl /etc/aqt/deployments.jsonl.lock; do
            if sudo -u aqt sh -c ": >> '$target'"; then echo "aqt can write $target"; exit 1; fi
          done
      - name: The service file is valid
        run: sudo systemd-analyze verify /etc/systemd/system/aqt-paper.service
      - name: Step 5 on a modified checkout is refused, logged, not retried
        run: |
          cd /tmp
          # a broken tracked config, which must not crash before the check
          echo "[[[ changed" | sudo tee -a /opt/aqt/app/configs/forward_paper.example.toml
          sudo systemctl start aqt-paper
          for _ in $(seq 60); do
            systemctl is-active --quiet aqt-paper || break
            sleep 1
          done
          test "$(systemctl show aqt-paper -p ExecMainStatus --value)" = 2
          test "$(systemctl show aqt-paper -p NRestarts --value)" = 0
          sudo grep REFUSE_START /var/lib/aqt/data/forward/deployment_refusals.jsonl | grep "checkout differs"

  # FE-4, FE4-8: the D-19 calibration image builds from its pinned base and
  # lock, and the real launcher (deploy/calibration/RUNBOOK.md) installs,
  # records a tiny pilot definition, runs, stops and resumes the threshold
  # run, runs development and chooses, with every start gate passing.
  calibration-launcher:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner CPU (the engine pins OPENBLAS_CORETYPE=Haswell)
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | grep -owE 'avx2|fma|avx512f|avx512_bf16|amx_tile' | xargs
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the bundle needs the history and the prereg branch
      - name: Package this commit and the preregistration branch
        run: |
          git branch -f ci-engine HEAD
          git branch -f ci-prereg origin/docs/d19-recommendation
          git bundle create /tmp/app.bundle ci-engine ci-prereg
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PREREG=$(git rev-parse origin/docs/d19-recommendation)" >> "$GITHUB_ENV"
      - name: Install and build
        run: |
          cd /tmp
          sudo sh "$GITHUB_WORKSPACE/deploy/calibration/d19.sh" install /tmp/app.bundle "$COMMIT"
          sudo systemd-analyze verify /etc/systemd/system/aqt-d19.slice
          sudo sh /opt/aqt-d19/app/deploy/calibration/d19.sh build
      - name: Probe the pinned OpenBLAS kernel on this CPU (FE4R-2, no skip)
        run: |
          rc=0
          sudo sh /opt/aqt-d19/app/deploy/calibration/d19.sh probe || rc=$?
          if [ "$rc" = 3 ]; then echo "::error::inconclusive: the probe segfaulted (seen only on AMD EPYC Zen 4/5 runners, under the pinned OpenBLAS kernel); check the CPU line above and rerun the job"; fi
          exit "$rc"
      # Owner decision D-20 §3a (a): adding the model libraries must leave the
      # engine's measured outputs byte-identical. The current image is rebuilt
      # from its own Dockerfile and lock as of 4afd350 (main before this
      # change, IM-R1) on this same runner; in both images, both canaries and
      # all 8 reference vectors must be present (IM-R2) and equal.
      - name: The model libraries leave the engine's outputs unchanged
        run: |
          mkdir /tmp/current-image
          for f in Dockerfile requirements.lock; do
            git show "4afd350:deploy/calibration/$f" > "/tmp/current-image/$f"
          done
          sudo docker build -q -t aqt-d19-current /tmp/current-image
          for img in aqt-d19-current "aqt-d19:$COMMIT"; do
            sudo docker run --rm --network none -e HOME=/tmp               -e OPENBLAS_NUM_THREADS=1 -e OPENBLAS_CORETYPE=Haswell               -v /opt/aqt-d19/app:/app:ro "$img" python -B -c               "import json, sys; sys.path[:0] = ['/app', '/app/src']
          from calibration import rundef; g = rundef.gating('compare')
          cases = {'refvec-k1-t5', 'refvec-k2-ar', 'refvec-k5-garch', 'refvec-k20-factor', 'refvec-k2-skewt', 'refvec-k5-unequal', 'refvec-k5-mixed-ar', 'refvec-k2-g2-unavailable'}
          if set(g['canaries']) != {'blas', 'libm'} or set(g['reference_vectors']) != cases:
              sys.exit('incomplete outputs: ' + json.dumps(g['canaries']) + json.dumps(g['reference_vectors']))
          print(json.dumps({k: g[k] for k in ('canaries', 'reference_vectors')}, sort_keys=True))"
          done > /tmp/outputs
          test "$(wc -l < /tmp/outputs)" = 2
          test "$(sed -n 1p /tmp/outputs)" = "$(sed -n 2p /tmp/outputs)"
          echo "identical: $(sed -n 1p /tmp/outputs | sha256sum)"
          sudo docker run --rm --network none "aqt-d19:$COMMIT" python -c             "import sklearn, lightgbm, scipy; print(sklearn.__version__, lightgbm.__version__, scipy.__version__)"
      - name: Record a pilot run definition
        run: |
          cd /opt/aqt-d19/app/deploy/calibration
          printf '%s' '{"purpose": "pilot", "replications": {"threshold": 3, "dev": 2}, "cells": [{"cell_id": "pilot-k2", "k": 2, "t": 40, "law": "gaussian", "dependence": "independent"}, {"cell_id": "pilot-k1", "k": 1, "t": 40, "law": "t5", "dependence": "independent"}]}' | sudo tee /var/lib/aqt-d19/cells.json
          echo '{}' | sudo tee /var/lib/aqt-d19/exploration.json
          sudo chown 990:990 /var/lib/aqt-d19/cells.json /var/lib/aqt-d19/exploration.json
          sudo sh d19.sh record --out definition.json --prereg-commit "$PREREG"             --engine-commit "$COMMIT" --cell-manifest cells.json             --exploration-manifest exploration.json
      - name: Run, stop, resume; then development and choices
        run: |
          cd /opt/aqt-d19/app/deploy/calibration
          sudo sh d19.sh run threshold
          sudo sh d19.sh stop
          sudo sh d19.sh run threshold
          test "$(sudo docker wait aqt-d19)" = 0 || { sudo docker logs aqt-d19; exit 1; }
          sudo sh d19.sh status | tee /tmp/status
          grep -qx "1 threshold/pilot-k1" /tmp/status
          grep -qx "1 threshold/pilot-k2" /tmp/status
          # FE7FR-1: a chain folder without a chunk is not a timing
          sudo install -d -o 990 -g 990 /var/lib/aqt-d19/store/dev /var/lib/aqt-d19/store/dev/pilot-k2
          test "$(sudo sh d19.sh times dev)" = "no dev chunks yet"
          sudo sh d19.sh run dev
          test "$(sudo docker wait aqt-d19)" = 0 || { sudo docker logs aqt-d19; exit 1; }
          sudo sh d19.sh choose
          sudo test -s /var/lib/aqt-d19/choices.json
          sudo sh d19.sh nonfinite | tee /tmp/nonfinite
          grep -q "^all cells: 0 non-finite of" /tmp/nonfinite
          sudo sh d19.sh clean-check | tee /tmp/clean
          grep -qx "PASS: the resumed threshold run equals the clean run" /tmp/clean
          ! sudo sh d19.sh clean-check  # FE7R-2: never reuses a clean store
          sudo sh d19.sh times threshold | tee /tmp/times
          test "$(grep -c '^threshold/pilot-k[12]:' /tmp/times)" = 2
          # FE7R2-2: a running container's memory.peak is where memwatch reads it
          cid=$(sudo docker run -d --network none --cgroup-parent aqt-d19.slice "aqt-d19:$COMMIT" sleep 30)
          pid=$(sudo docker inspect -f '{{.State.Pid}}' "$cid")
          cg=$(sudo cut -d: -f3 "/proc/$pid/cgroup"); echo "cgroup $cg"
          case "$cg" in */aqt-d19.slice/*) ;; *) echo "not in aqt-d19.slice"; exit 1 ;; esac
          peak=$(sudo cat "/sys/fs/cgroup$cg/memory.peak")
          echo "memory.peak $peak"; test "$peak" -gt 0  # cgroup files have size 0
          sudo docker rm -f "$cid"
          sudo sh d19.sh status
          sudo sh d19.sh timing | tee /tmp/timing
          test "$(grep -c dsr_median /tmp/timing)" = 3
